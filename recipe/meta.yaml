{% set name = "AdaptiveCpp" %}
{% set version = "25.10.0" %}
{% set llvm_spirv_rev = {
    "16": "d678e6a2a95849c9985c8d209f67b318999083c6",
    "17": "21d3f7deabd85dcdebd207d8dc75958ab902e4a4",
    "18": "530c950568ce80137e1c0876d9afc403455a3cb6",
    "19": "ed04cf4540ec8b1cda2921c3f2eabc72a9291465",
} %}
{% set llvm_spirv_sha256 = {
    "16": "cabeb13932480edeb53e07797165b2a29ffe9fff82701504e6bb9b9e605c8e64",
    "17": "b227a5adb4590ba28dd5fa612b96f732847d4b5c6019b4fd94c7397f4ee7b1e9",
    "18": "4d52536344fe0a4962380ab0316db7e5f35cd218d8fcbdf0c795a7eb57302574",
    "19": "9098743b0b0e759b02e3e4e1efc1931f51bed87b89296dada072a0eedeb1a06a",
} %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://github.com/AdaptiveCpp/AdaptiveCpp/archive/v{{ version }}.tar.gz
    sha256: 334b16ebff373bd2841f83332c2ae9a45ec192f2cf964d5fdfe94e1140776059
    patches:
      - patches/0001-Install-tool-binaries-to-the-same-folder-of-lib.patch  # [linux]
      - patches/0002-Fall-back-missing-functions.patch  # [linux]
      - patches/0003-Use-packaged-dependency-sources.patch  # [linux]
  - url: https://github.com/AdaptiveCpp/SPIRV-LLVM-Translator/archive/{{ llvm_spirv_rev[llvm_version|string] }}.tar.gz  # [linux]
    sha256: {{ llvm_spirv_sha256[llvm_version|string] }}  # [linux]
    folder: acpp-spirv-llvm-translator  # [linux]
  - url: https://github.com/KhronosGroup/OpenCL-Headers/archive/265df85aec478d14a5c5880d7bb92d7dd52714ef.tar.gz  # [linux]
    sha256: 07002bdb6107dfc8ab1736c3894ff7f1501029751960c0b2dd6157e43c0b9290  # [linux]
    folder: opencl-headers  # [linux]
  - url: https://github.com/KhronosGroup/OpenCL-CLHPP/archive/67d100e70612341707725b6648ccca4c10b0dc31.tar.gz  # [linux]
    sha256: a6112af8ba2cc8a5248bcc7399624258cb9609b31ccd4a65222bf61893c2c618  # [linux]
    folder: opencl-clhpp  # [linux]

build:
  number: 4
  run_exports:
    - {{ pin_subpackage('adaptivecpp', max_pin='x.x') }}
  ignore_run_exports:
    - libboost
    - llvm
    - llvm-openmp  # [not win]
  missing_dso_whitelist:
    # https://conda-forge.org/docs/maintainer/knowledge_base/#nvcudadll-cannot-be-found-on-windows
    - "*/nvcuda.dll"    # [win]
    - "*/libcuda.so.1"  # [linux]
  skip: true  # [osx and x86_64]
  skip: true  # [win and cuda_compiler_version == "13.0"]
  skip: true  # [linux and aarch64 and cuda_compiler_version != "None"]
  string: cpu_llvm{{ llvm_version }}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [cuda_compiler_version == "None"]
  string: cuda{{ cuda_compiler_version | replace('.', '') }}_llvm{{ llvm_version }}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [cuda_compiler_version != "None"]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - doxygen
    - make       # [linux]
    - ninja      # [not win]
    - pkgconfig  # [linux]
    {% if cuda_compiler_version != "None" %}
    - {{ compiler('cuda') }}
    - cuda-cudart-dev  # [build_platform != target_platform]
    {% endif %}
  host:
    - clangdev
    - hipcc        # [linux and x86_64]
    - libboost-devel
    - lld {{ llvm_version }}  # [not win]
    - llvmdev {{ llvm_version }}
    - llvm-openmp {{ llvm_version }}
    - libopencl-devel
    - rocm-device-libs  # [linux and x86_64]
    - spirv-headers  # [linux]
    # AdaptiveCpp builds its own SPIR-V translator fork from the source above.
    # Keep SPIRV-Tools below 2026 while the Linux matrix uses LLVM 16-19.
    - spirv-tools <2026  # [linux]
    {% if cuda_compiler_version != "None" %}
    # cuda-compat is needed for libcuda.so.1
    - cuda-compat      # [linux]
    - cuda-cudart-dev
    - cuda-driver-dev  # [linux]
    - cuda-nvvm-tools  # [linux and x86_64]
    - cuda-version {{ cuda_compiler_version }}
    {% endif %}
  run:
    - clangdev  # [osx]
    - hip-runtime-amd  # [linux and x86_64]
    - lld {{ llvm_version }}  # [not win]
    - libllvm{{ llvm_version }}
    - libnuma  # [linux]
    - llvm {{ llvm_version }}
    # The generic/OpenMP runtime JIT invokes opt/llc from the matching LLVM.
    - llvm-tools {{ llvm_version }}  # [not win]
    - llvm-openmp {{ llvm_version }}  # [osx]
    - rocm-device-libs  # [linux and x86_64]
    {% if cuda_compiler_version != "None" %}
    - cuda-nvvm-tools  # [linux and x86_64]
    {% endif %}

test:
  commands:
    - test -f $PREFIX/include/AdaptiveCpp/sycl/sycl.hpp  # [not win]
    - test -f $PREFIX/lib/cmake/AdaptiveCpp/adaptivecpp-config.cmake  # [not win]
    - test -f $PREFIX/lib/libacpp-common${SHLIB_EXT}  # [not win]
    - test -f $PREFIX/lib/hipSYCL/librt-backend-omp${SHLIB_EXT}  # [not win]
    - test -f $PREFIX/lib/hipSYCL/librt-backend-ocl${SHLIB_EXT}  # [linux]
    - test -f $PREFIX/lib/hipSYCL/librt-backend-hip${SHLIB_EXT}  # [linux and x86_64]
    - test -f $PREFIX/lib/hipSYCL/bitcode/libkernel-sscp-host-full.bc  # [linux]
    - test ! -e $PREFIX/lib/lib/hipSYCL/bitcode/libkernel-sscp-host-full.bc  # [linux]
    - test -x $PREFIX/lib/hipSYCL/llvm-to-backend/llvm-to-spirv-tool  # [linux]
    - "test -x $PREFIX/bin/opt-{{ llvm_version }} || test -x $PREFIX/bin/opt"  # [linux]
    - "test -x $PREFIX/bin/llc-{{ llvm_version }} || test -x $PREFIX/bin/llc"  # [linux]
    - "! grep -R \"_build_env.*/nvvm/libdevice\\|/lib/lib/hipSYCL/bitcode\" $PREFIX/etc/AdaptiveCpp $PREFIX/lib/cmake/AdaptiveCpp"  # [linux]
    {% if cuda_compiler_version != "None" %}
    - test -f $PREFIX/lib/hipSYCL/librt-backend-cuda${SHLIB_EXT}  # [not win]
    - test -f $PREFIX/nvvm/libdevice/libdevice.10.bc  # [linux and x86_64]
    {% endif %}
    - acpp-info  # [not win]
    - cmake -S tests -B test-build -G Ninja  # [linux and x86_64 and cuda_compiler_version == "None"]
    - cmake --build test-build  # [linux and x86_64 and cuda_compiler_version == "None"]
    - ACPP_VISIBILITY_MASK=omp ./test-build/adaptivecpp-example  # [linux and x86_64 and cuda_compiler_version == "None"]
    - if not exist %PREFIX%\\Library\\include\\AdaptiveCpp\\SYCL\\sycl.hpp exit 1  # [win]
    - if not exist %PREFIX%\\Library\\lib\\cmake\\AdaptiveCpp\\adaptivecpp-config.cmake exit 1  # [win]
    - if not exist %PREFIX%\\Library\\lib\\acpp-common.lib exit 1  # [win]
    - if not exist %PREFIX%\\Library\\bin\\acpp-common.dll exit 1  # [win]
    - if not exist %PREFIX%\\Library\\lib\\hipSYCL\\rt-backend-omp.lib exit 1  # [win]
    - if not exist %PREFIX%\\Library\\bin\\hipSYCL\\rt-backend-omp.dll exit 1  # [win]
    {% if cuda_compiler_version != "None" %}
    - if not exist %PREFIX%\\Library\\lib\\hipSYCL\\rt-backend-cuda.lib exit 1  # [win]
    - if not exist %PREFIX%\\Library\\bin\\hipSYCL\\rt-backend-cuda.dll exit 1  # [win]
    {% endif %}
    - "acpp-info.exe"  # [win]
  requires:
    - {{ compiler("c") }}
    - {{ compiler("cxx") }}
    - clangdev
    - clangxx {{ llvm_version }}  # [linux]
    - cmake
    - ninja  # [unix]
  files:
    - tests/

about:
  home: https://adaptivecpp.github.io/
  summary: 'The independent, community-driven platform for heterogeneous programming in C++'
  description: |
    AdaptiveCpp is the independent, community-driven modern platform for
    C++-based heterogeneous programming models targeting CPUs and GPUs from all
    major vendors. AdaptiveCpp lets applications adapt themselves to all the
    hardware found in the system. This includes use cases where a single binary
    needs to be able to target all supported hardware, or utilize hardware from
    different vendors simultaneously.
  license: BSD-2-Clause
  license_file: LICENSE
  dev_url: https://github.com/AdaptiveCpp/AdaptiveCpp

extra:
  recipe-maintainers:
    - jeongseok-meta
