c_stdlib_version:  # [osx and x86_64]
  - '11.0'        # [osx and x86_64]

# The native osx-64 package carries LLVM/Clang 19 at runtime, so keep the
# build and test compiler aligned to avoid mixing compiler-rt 21 with clangdev 19.
c_compiler_version:  # [osx and x86_64]
  - '19'             # [osx and x86_64]
cxx_compiler_version:  # [osx and x86_64]
  - '19'               # [osx and x86_64]

llvm_version:
  - 16  # [not (osx and x86_64)]
  - 17  # [not (osx and x86_64)]
  - 18  # [not (osx and x86_64)]
  - 19
